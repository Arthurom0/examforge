name: Build macOS app

# Builds unsigned ExamForge .dmg files on GitHub's Mac runners.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - runner: macos-13 # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: ./desktop/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ExamForge-macOS-${{ matrix.arch }}
          path: desktop/release/*.dmg
          if-no-files-found: error
