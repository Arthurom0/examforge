<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ExamForge</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px -apple-system, system-ui, sans-serif;
             background: #f8fafc; color: #334155; }
      @media (prefers-color-scheme: dark) { body { background: #020617; color: #cbd5e1; } }
      .box { text-align: center; }
      .logo { width: 64px; height: 64px; border-radius: 14px; background: #4f46e5; color: #fff; display: grid;
              place-items: center; font-size: 34px; font-weight: 700; margin: 0 auto 16px; }
      .spin { width: 18px; height: 18px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
              display: inline-block; vertical-align: middle; margin-right: 8px; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">E</div>
      <span class="spin"></span>Starting ExamForge…
    </div>
  </body>
</html>
